name: Build CinVerse Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle wrapper
          ./gradlew assembleDebug --stacktrace

      - name: Find and Prepare APK File
        id: find_apk
        run: |
          mkdir -p output_apk
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" output_apk/CinVerse-v1.0.0.apk
            echo "Found APK: $APK_FILE"
          else
            echo "Error: No APK file found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CinVerse-v1.0.0.apk
          path: output_apk/CinVerse-v1.0.0.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "CinVerse Android App v1.0.0"
          body: |
            ### 🎬 CinVerse Official Android Release (v1.0.0)

            - 🚀 **100% Ad-Free & Pop-Up Blocked**
            - ⚡ **Buffer-Free 1080p & 4K Streaming** (Multi-Audio: Hindi, English, Regional)
            - 📱 **Double-Tap 10s Seek Gestures** (YouTube / Netflix style)
            - 🍿 **True Full-Screen Cinema & Immersive Video Playback**

            #### 📥 Download:
            Download **`CinVerse-v1.0.0.apk`** below and install on any Android 7.0+ device!
          files: output_apk/CinVerse-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
