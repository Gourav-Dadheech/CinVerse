<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <filter id="pixarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Disney cursive -->
  <text x="68" y="44" font-family="'Brush Script MT', 'Palatino Linotype', cursive, serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Disney</text>
  <!-- Dot / Star -->
  <circle cx="120" cy="36" r="4" fill="#38BDF8"/>
  <!-- PIXAR bold block -->
  <text x="180" y="44" font-family="'Outfit', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4" filter="url(#pixarGlow)">PIXAR</text>
</svg>