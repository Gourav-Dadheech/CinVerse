  <!-- WORLD -->
  <text x="120" y="62" font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" font-size="16" font-weight="700" fill="#E2E8F0" text-anchor="middle" letter-spacing="8">WORLD</text>
