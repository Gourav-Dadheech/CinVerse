<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 70" width="240" height="70">
  <defs>
    <linearGradient id="animeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="animeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Katakana Anime badge -->
  <rect x="25" y="16" width="38" height="38" rx="8" fill="url(#animeGrad)" filter="url(#animeGlow)"/>
  <text x="44" y="42" font-family="'Noto Sans JP', 'Outfit', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle">魂</text>
  <!-- ANIME UNIVERSE -->
  <text x="75" y="36" font-family="'Outfit', 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="3">ANIME</text>
  <text x="75" y="52" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#C084FC" letter-spacing="6">UNIVERSE</text>
</svg>