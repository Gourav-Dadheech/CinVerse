<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="vNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#38BDF8" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Dark Cinema Capsule Frame -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0C101C" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- CV Typography -->
  <text x="12" y="42" font-family="'Outfit', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">C</text>
  <text x="32" y="42" font-family="'Outfit', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="url(#vNeonGrad)">V</text>

  <!-- Twinkling Star (CinVerse logo 2) -->
  <g transform="translate(50, 14)" filter="url(#starGlow)">
    <line x1="0" y1="-7" x2="0" y2="7" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#38BDF8" stroke-width="1" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Cyan Accent Bottom Pill -->
  <rect x="14" y="49" width="36" height="3" rx="1.5" fill="url(#barGrad)"/>
</svg>
