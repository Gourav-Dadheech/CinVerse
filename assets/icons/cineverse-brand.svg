<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 48" width="250" height="48" fill="none">
  <defs>
    <linearGradient id="brandPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="verseNeonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="brandGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#8B5CF6" flood-opacity="0.6"/>
    </filter>
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Sleek Dynamic Play Prism Chevron (FLIQ TV / Cinema vector mark) -->
  <g transform="translate(2, 7)">
    <path d="M 2 3 L 18 17 L 2 31 Z" fill="url(#brandPlayGrad)" filter="url(#brandGlow)"/>
    <path d="M 12 10 L 25 17 L 12 24 Z" fill="#FFFFFF"/>
    <polygon points="6,9 15,17 6,25" fill="#6D28D9"/>
  </g>

  <!-- Brand Wordmark: CinVerse -->
  <text x="38" y="32" font-family="'Outfit', 'Poppins', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5">
    <tspan fill="#FFFFFF">Cin</tspan><tspan fill="url(#vGrad)">V</tspan><tspan fill="url(#verseNeonGrad)">erse</tspan>
  </text>

  <!-- Cinema Twinkling Star (From user logo 2) -->
  <g transform="translate(225, 11)" filter="url(#starGlow)">
    <path d="M 0,-7 L 1.2,-1.5 L 7,0 L 1.5,1.2 L 0,7 L -1.2,1.5 L -7,0 L -1.5,-1.2 Z" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="1.2" fill="#38BDF8"/>
    <!-- Micro sparkles -->
    <circle cx="5" cy="-4" r="0.8" fill="#C084FC" opacity="0.85"/>
    <circle cx="7" cy="4" r="0.6" fill="#38BDF8" opacity="0.75"/>
  </g>
</svg>
