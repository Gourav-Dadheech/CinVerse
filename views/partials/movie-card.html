<!-- ============================================================
     PARTIAL: movie-card.html
     Reused by the <movie-card> directive everywhere in the app.
     ============================================================ -->
<a href="#!/movie/{{ movie.id }}" class="movie-card scroll-reveal">

  <div class="movie-card-poster-wrap">
    <img class="movie-card-poster" ng-src="{{ posterUrl }}" alt="{{ movie.title }} poster" loading="lazy" />

    <!-- Rating badge -->
    <div class="movie-card-rating">
      <i class="fa-solid fa-star"></i> {{ ratingDisplay }}
    </div>

    <!-- Hover overlay with quick actions -->
    <div class="movie-card-overlay">
      <button class="card-action-btn heart-btn"
              ng-class="{ 'active': isFavorite, 'pulse': heartPulse }"
              ng-click="toggleFavorite($event)"
              title="Add to Favorites">
        <i class="fa-solid fa-heart"></i>
      </button>

      <button class="card-action-btn bookmark-btn"
              ng-class="{ 'active': isWatchlisted, 'pulse': bookmarkPulse }"
              ng-click="toggleWatchlist($event)"
              title="Add to Watchlist">
        <i class="fa-solid fa-bookmark"></i>
      </button>

      <span class="card-view-details">
        <i class="fa-solid fa-circle-info"></i> View Details
      </span>
    </div>
  </div>

  <div class="movie-card-info">
    <h4 class="movie-card-title">{{ movie.title }}</h4>
    <span class="movie-card-year">{{ releaseYear }}</span>
  </div>

</a>
